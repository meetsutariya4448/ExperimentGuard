version: 2

sources:
  - name: raw
    description: >
      Tables loaded by the Python pipeline. `raw_packages` comes from the OSF archive
      CSVs; the `analysis_*` tables are written by experimentguard.analyze, which
      computes the statistics SQL cannot express (ratio confidence intervals, Holm
      adjustment within each experiment, power, Bayesian posteriors).
    schema: main
    tables:
      - name: raw_packages
        columns:
          - name: arm_id
            tests: [not_null, unique]
          - name: test_id
            tests: [not_null]
          - name: impressions
            tests: [not_null]
      - name: analysis_experiment_stats
        columns:
          - name: test_id
            tests: [not_null, unique]
      - name: analysis_arm_comparison
      - name: analysis_policy_selection
