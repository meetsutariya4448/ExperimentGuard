name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest -q
        env:
          PYTHONPATH: src

      # The fixture is ~200 rows, committed to the repo, so CI exercises the whole
      # pipeline without downloading ~95 MB of archive data on every push.
      - name: Pipeline smoke test on the committed fixture
        run: python tests/smoke_pipeline.py
        env:
          PYTHONPATH: src

      - name: dbt parse
        working-directory: dbt/experimentguard
        run: dbt parse --profiles-dir .
        env:
          DBT_PROFILES_DIR: .
